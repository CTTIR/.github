# Reusable R CMD check for the CTTIR suite.
#
#   uses: CTTIR/.github/.github/workflows/R-CMD-check.yaml@main
#
# Replaces 13+ hand-drifted copies. Six were hashed on 2026-08-21 and returned
# six different SHA1s, with substantive divergence: only some pass --as-cran,
# only one carried extra-repositories for the CTTIR r-universe, and three
# repositories displayed this badge with no workflow behind it at all.
on:
  workflow_call:
    inputs:
      bioc-repository:
        description: "Add the Bioconductor repo so pak can solve Bioc Suggests."
        type: boolean
        default: false
      macos-xquartz:
        description: "Install XQuartz for macOS packages requiring X11 libraries."
        type: boolean
        default: false
    secrets:
      CTTIR_PRIVATE_TERMS:
        description: "Regular expression of study and person names that must not occur in the package."
        required: false

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    continue-on-error: ${{ matrix.config.experimental || false }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # oldrel-3 covers the R version DESCRIPTION actually claims to
          # support. Without it, code using base-R features newer than the
          # declared minimum (e.g. `%||%`, added in R 4.4.0) is never built
          # on a version where it fails.
          # Informational, not blocking. Its job is to answer "does the R
          # version DESCRIPTION claims to support actually work". Read its
          # result; do not gate on it. The real fix where it fails for a
          # genuine reason is to correct the declared R minimum.
          # Old R pairs with old Bioconductor (R 4.3 -> 3.18), which pak's
          # default mirror, bioconductor.posit.co, does not carry: every
          # 3.18 repository 404s there. bioconductor.org still serves it.
          - {os: ubuntu-latest,  r: 'oldrel-3', experimental: true, bioc-mirror: 'https://bioconductor.org'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: false
      CTTIR_PRIVATE_TERMS: ${{ secrets.CTTIR_PRIVATE_TERMS }}

    steps:
      - uses: actions/checkout@v4

      # Only a count is printed: the terms and the lines that match must not
      # appear in a public log. Run the same grep locally to see where.
      - name: Check for private terms
        if: env.CTTIR_PRIVATE_TERMS != '' && runner.os == 'Linux' && matrix.config.r == 'release'
        shell: bash
        run: |
          set +e
          grep -r -I -P -l --exclude-dir=.git -e "$CTTIR_PRIVATE_TERMS" . > "$RUNNER_TEMP/private-hits.txt"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            echo "::error::The private-term scan could not run."
            exit 1
          fi
          n=$(wc -l < "$RUNNER_TEMP/private-hits.txt")
          if [ "$n" -gt 0 ]; then
            echo "::error::$n file(s) contain private terms."
            exit 1
          fi
          echo "No private terms found."

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          extra-repositories: https://cttir.r-universe.dev

      - name: Use the Bioconductor mirror this row needs
        if: matrix.config.bioc-mirror
        shell: bash
        env:
          BIOC_MIRROR: ${{ matrix.config.bioc-mirror }}
        run: echo "R_BIOC_MIRROR=$BIOC_MIRROR" >> "$GITHUB_ENV"

      - name: Install X11 libraries on macOS
        if: runner.os == 'macOS' && inputs.macos-xquartz
        run: |
          brew install --cask xquartz
          brew list --cask xquartz
          test -r /opt/X11/lib/libX11.6.dylib
          ls -l /opt/X11/lib/libX11.6.dylib

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          extra-repositories: ${{ inputs.bioc-repository && 'https://bioconductor.org/packages/release/bioc' || '' }}

      - name: Install Bioconductor Suggests (optional)
        run: |
          if (!requireNamespace("BiocManager", quietly = TRUE))
            install.packages("BiocManager")
          bioc_pkgs <- c("DESeq2", "edgeR", "limma", "ShortRead", "Biostrings",
                         "Rsamtools", "GenomicAlignments", "GenomicFeatures",
                         "GenomicRanges", "SummarizedExperiment", "Biobase",
                         "ComplexHeatmap", "EBImage", "SpatialExperiment",
                         "S4Vectors", "SingleCellExperiment")
          desc_suggests <- strsplit(read.dcf("DESCRIPTION")[, "Suggests"], ",\\s*")[[1]]
          desc_suggests <- trimws(gsub("\\s*\\(.*\\)", "", desc_suggests))
          to_install <- intersect(bioc_pkgs, desc_suggests)
          if (length(to_install) > 0) {
            message("Installing Bioconductor packages: ", paste(to_install, collapse = ", "))
            tryCatch(
              BiocManager::install(to_install, update = FALSE),
              error = function(e) message("Bioconductor install skipped: ", e$message)
            )
          } else {
            message("No Bioconductor Suggests found - skipping.")
          }
        shell: Rscript {0}
        continue-on-error: true

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
